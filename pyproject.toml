[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-easycheck-webserver"
version = "1.0.0"
description = "轻松夜答管理平台 - EasyCheck Web 监控管理服务"
license = { text = "MIT" }
authors = [{ name = "Ntzy123" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0",
    "psutil>=5.9",
    "requests>=2.31.0",
    "pywin32>=306",
]

[project.optional-dependencies]
build = ["pyinstaller"]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
auto-easycheck-webserver = "auto_easycheck_webserver:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
norecursedirs = [
    ".venv",
    "venv",
    "dist",
    "build",
]
